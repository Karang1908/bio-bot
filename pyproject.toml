[project]
name = "one-brain-many-bodies"
version = "0.1.0"
description = "A self-learning, connectome-wired brain that controls and coordinates many bodies."
requires-python = ">=3.12"
dependencies = [
    "mujoco>=3.14",
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "pyarrow>=17",
    "mlx>=0.32; sys_platform == 'darwin'",  # Stage 0 brain runtime on the Mac GPU
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
train = ["kaggle>=2.2"]  # pushes training notebooks to Kaggle's free GPUs

[tool.pytest.ini_options]
testpaths = ["tests"]
